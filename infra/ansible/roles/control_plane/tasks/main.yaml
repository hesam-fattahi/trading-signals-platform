- name: Install Docker for the host-level registry
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Ensure registry data directory exists
  ansible.builtin.file:
    path: /var/lib/trading-registry
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Install systemd unit for the host registry
  ansible.builtin.copy:
    dest: /etc/systemd/system/trading-registry.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Trading signals platform host registry
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=-/usr/bin/docker rm -f trading-registry
      ExecStart=/usr/bin/docker run --name trading-registry --publish 192.168.56.10:5000:5000 --volume /var/lib/trading-registry:/var/lib/registry --cpus=0.2 --cpu-shares=51 --memory=256m --memory-reservation=128m --restart=unless-stopped registry:2
      ExecStop=/usr/bin/docker stop trading-registry
      ExecStopPost=/usr/bin/docker rm -f trading-registry
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Enable and start the host registry service
  ansible.builtin.systemd:
    name: trading-registry
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Wait for the registry to respond on the host address
  ansible.builtin.wait_for:
    host: 192.168.56.10
    port: 5000
    timeout: 60
  when: inventory_hostname == "control-plane"
  tags: [registry]

- name: Check if control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadmin_conf

- name: Render kubeadm init configuration
  ansible.builtin.template:
    src: kubeadm-init-config.yaml.j2
    dest: /tmp/kubeadm-init-config.yaml
    mode: '0644'
  when: not kubeadmin_conf.stat.exists

- name: Initialize Control Plane (kubeadm init)
  ansible.builtin.command: >
    kubeadm init
    --config=/tmp/kubeadm-init-config.yaml
    --skip-phases=addon/kube-proxy
    --ignore-preflight-errors=NumCPU
  when: not kubeadmin_conf.stat.exists

- name: Create .kube directory for vagrant user
  ansible.builtin.file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: '0755'

- name: Copy admin.conf to vagrant user .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: '0600'

- name: Generate kubeadm join command for worker nodes
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false

- name: Extract bootstrap token and CA cert hash from join command
  ansible.builtin.set_fact:
    join_token: "{{ join_command_raw.stdout.split('token ')[1].split(' ')[0] }}"
    join_ca_hash: "{{ join_command_raw.stdout.split('discovery-token-ca-cert-hash ')[1].split(' ')[0] }}"

- name: Set join command as dummy host fact across all nodes
  ansible.builtin.add_host:
    name: "K8S_JOIN_HOLDER"
    join_command: "{{ join_command_raw.stdout }}"
    join_token: "{{ join_token }}"
    join_ca_hash: "{{ join_ca_hash }}"
    control_plane_ip: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
