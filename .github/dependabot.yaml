version: 2

updates:
  # -------------------------------------------------------------------------
  # Go modules — four modules, globbed into one entry per ecosystem.
  # -------------------------------------------------------------------------
  - package-ecosystem: "gomod"
    directories:
      - "/services/*"
      - "/gen/go"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # -------------------------------------------------------------------------
  # Java (Maven)
  # -------------------------------------------------------------------------
  - package-ecosystem: "maven"
    directory: "/services/indicator-calculator"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # -------------------------------------------------------------------------
  # Python (pip / requirements.txt)
  # -------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/services/generator"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # -------------------------------------------------------------------------
  # Node (npm)
  # -------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # -------------------------------------------------------------------------
  # Docker base images — one entry, globbed over all service directories.
  # -------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/services/*"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # -------------------------------------------------------------------------
  # GitHub Actions — pinned action versions in workflows.
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2