name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Stage 1 — Fast fail. Lint, format, typecheck.
  # ===========================================================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            services/*/go.sum
            gen/go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"

      - name: Install tools
        run: make install-tools

      - name: Lint and typecheck
        run: make check-quick

  # ===========================================================================
  # Stage 2 — Tests. Parallel per language.
  # ===========================================================================
  test-go:
    name: test (go)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            services/*/go.sum
            gen/go/go.sum
      - run: make go-test

  test-java:
    name: test (java)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make java-test

  test-js:
    name: build (frontend)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: make js-build

  # ===========================================================================
  # Stage 3 — Chart validation. Cheap, catches template errors.
  # ===========================================================================
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"
      - run: make helm-lint

  # ===========================================================================
  # Stage 4 — Build images. Does not push. Verifies Dockerfiles on a clean
  # runner.
  # ===========================================================================
  build-images:
    name: build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test-go, test-java, test-js, helm-lint]
    strategy:
      fail-fast: false
      matrix:
        service: [generator, ingestion, indicator, signal, bff]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"

      - name: Generate protobuf stubs
        run: make proto-generate

      - name: Build ${{ matrix.service }} image
        run: make build-${{ matrix.service }}