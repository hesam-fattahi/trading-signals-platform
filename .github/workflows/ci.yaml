name: CI

on:
  pull_request:
    branches: main
  push:
    branches: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Set up Buf CLI (Protobuf Linter)
        uses: bufbuild/buf-setup-action@v1

      - name: Run Protobuf Checks & Generation
        run: make proto-check

      - name: Check Go formatting
        run: make go-fmt-check

      - name: Run go vet
        run: make go-vet

      - name: Check Python formatting & lint
        run: make python-check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Run Unit Tests
        run: make unit-test

  vulnerability:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Vulnerability Check
        run: make vuln-check

  build:
    name: Build Container (${{ matrix.service }})
    needs:
      - quality
      - unit-test
      - vulnerability
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [generator, ingestion, stream-processor, signal-service]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container via Makefile
        run: make build-${{ matrix.service }}