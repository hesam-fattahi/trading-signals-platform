global:
  imageRegistry: 192.168.56.10:5000
  imageTag: dev
  imagePullPolicy: Always

# Shared configuration for BFF and Generator services
marketData:
  ticker: BTC-USD
  period: 5d
  interval: 1m
  streamSpeedSec: "0.2"

kafka:
  bootstrap: trading-events-kafka-bootstrap.platform.svc.cluster.local:9092
  topics:
    rawTicks: raw-ticks
    indicatorEvents: indicator-events
    signalEvents: signal-events
    
generator:
  enabled: true
  replicaCount: 1
  image:
    repository: trading-generator
    tag: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingestion:
  enabled: true
  replicaCount: 1
  image:
    repository: trading-ingestion
    tag: ""
  config:
    logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

indicator:
  enabled: true
  replicaCount: 1
  terminationGracePeriodSeconds: 60 
  image:
    repository: trading-indicator-calculator
    tag: ""
  config:
    logLevel: info
    maxBars: "100"
    bollingerWindow: "20"
    bollingerK: "2.0"
    rsiWindow: "14"
    adxWindow: "14"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

signal:
  enabled: true
  replicaCount: 1
  image:
    repository: trading-signal-decision
    tag: ""
  config:
    logLevel: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

bff:
  enabled: true
  replicaCount: 1
  image:
    repository: trading-bff
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi