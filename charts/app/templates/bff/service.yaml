{{- if .Values.bff.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bff
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
  annotations:
    io.cilium/lb-ipam-ips: "192.168.56.243"
spec:
  type: LoadBalancer
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bff
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
{{- end }}
