{{- if .Values.signal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-decision
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: signal-decision
spec:
  replicas: {{ .Values.signal.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: signal-decision
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: signal-decision
    spec:
      containers:
        - name: signal-decision
          image: {{ include "app.image" (dict "root" . "image" .Values.signal.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: INPUT_TOPIC
              value: {{ .Values.kafka.topics.indicatorEvents | quote }}
            - name: OUTPUT_TOPIC
              value: {{ .Values.kafka.topics.signalEvents | quote }}
            - name: CONSUMER_GROUP
              value: "signal-decision"
            - name: LOG_LEVEL
              value: {{ .Values.signal.config.logLevel | quote }}
          resources:
            {{- toYaml .Values.signal.resources | nindent 12 }}
{{- end }}