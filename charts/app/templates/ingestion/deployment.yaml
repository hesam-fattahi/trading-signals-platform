{{- if .Values.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          image: {{ include "app.image" (dict "root" . "image" .Values.ingestion.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: WS_URL
              value: "ws://generator:8080/"
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.bootstrap | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topics.rawTicks | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.ingestion.config.logLevel | quote }}
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
{{- end }}