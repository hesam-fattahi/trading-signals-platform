{{- if .Values.strimzi.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .Values.topics.indicatorStateChangelog.name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    strimzi.io/cluster: {{ .Values.kafka.clusterName }}
spec:
  partitions: {{ .Values.topics.indicatorStateChangelog.partitions }}
  replicas: {{ .Values.topics.indicatorStateChangelog.replicas }}
  config:
    cleanup.policy: {{ .Values.topics.indicatorStateChangelog.cleanupPolicy | quote }}
    retention.ms: {{ .Values.topics.indicatorStateChangelog.retentionMs | quote }}
{{- end }}